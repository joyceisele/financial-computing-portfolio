<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon | Financial Computing Portfolio</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<header id="app-header"></header>

<main class="page-container">
  <section class="page-header">
    <div>
      <p class="eyebrow">Decision Support</p>
      <h1>Horizon</h1>
      <p>Consolidated portfolio intelligence for investment decision-making.</p>
    </div>

    <button id="download-csv" class="secondary-button" type="button">
      Download CSV
    </button>
  </section>

  <section class="filter-panel">
    <div class="filter-group">
      <label for="ticker-filter">Search</label>
      <input id="ticker-filter" type="search" placeholder="Search ticker or security...">
    </div>

    <div class="filter-group">
      <label for="asset-filter">Asset Class</label>
      <select id="asset-filter">
        <option value="">All Asset Classes</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="currency-filter">Currency</label>
      <select id="currency-filter">
        <option value="">All Currencies</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="risk-filter">Risk</label>
      <select id="risk-filter">
        <option value="">All Risk Levels</option>
      </select>
    </div>

    <button id="reset-filters" class="secondary-button" type="button">Reset</button>
  </section>

  <div class="table-summary">
    <span id="record-count">Loading...</span>
  </div>

  <section class="card table-card">
    <div class="table-wrapper">
      <table id="horizon-table">
        <thead>
          <tr>
            <th data-sort="ticker">Ticker</th>
            <th data-sort="name">Security</th>
            <th data-sort="assetClass">Asset Class</th>
            <th data-sort="sector">Sector</th>
            <th data-sort="currency">Currency</th>
            <th data-sort="risk">Risk</th>
            <th data-sort="price">Price</th>
            <th data-sort="dailyChange">Daily Change %</th>
            <th data-sort="oneYearReturn">1Y Return</th>
            <th data-sort="benchmark">Benchmark</th>
            <th data-sort="excessReturn">Excess Return</th>
          </tr>
        </thead>
        <tbody id="horizon-table-body"></tbody>
      </table>
    </div>

    <div id="empty-state" class="empty-state hidden">
      No investments match your filters.
    </div>
  </section>

  <nav id="pagination" class="pagination" aria-label="Horizon pagination"></nav>
</main>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/horizon.js"></script>
</body>
</html>
