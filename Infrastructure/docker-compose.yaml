services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: financial-computing-backend
    ports:
      - "3000:3000"
    volumes:
      - ../backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - financial-network

  frontend:
    image: nginx:alpine
    container_name: financial-computing-frontend
    ports:
      - "8080:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - financial-network

networks:
  financial-network:
    driver: bridge

volumes:
  backend_node_modules: